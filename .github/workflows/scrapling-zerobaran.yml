name: Scrapling-ZeroBaran — Autonomous Crawler (Project #38, © Baran Avisat)

on:
  schedule:
    - cron: "0 */6 * * *"        # every 6 hours (free GH Actions runner)
    - cron: "30 1 * * 0"         # weekly compliance/health digest Sunday 01:30 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Run only one target name (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrapling-zerobaran
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core free stack
        run: |
          pip install --quiet requests beautifulsoup4 lxml pyyaml
          # optional heavier engines are auto-skipped if not installed

      - name: Self-test (offline contracts, zero keys needed)
        run: python scrapling-zerobaran/tests/smoke_test.py

      - name: Run autonomous crawl
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scrapling-zerobaran/scripts
          if [ -n "${{ github.event.inputs.target }}" ]; then
            python scrape_run.py run --target "${{ github.event.inputs.target }}"
          else
            python scrape_run.py run
          fi
          python scrape_run.py export

      - name: Persist state & exports back to repo
        run: |
          git config user.name "scrapling-zerobaran-bot"
          git config user.email "Baranavisat@gmail.com"
          git add -f scrapling-zerobaran/state scrapling-zerobaran/exports || true
          git diff --cached --quiet || git commit -m "chore(scrapling): crawl state snapshot $(date -u +%FT%TZ)"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🕸️ Scrapling-ZeroBaran run complete"
            echo '```json'; cat scrapling-zerobaran/state/runs.json | head -c 2000; echo ''; echo '```'
            echo "_© Baran Avisat — ZeroBaran Studio — WhatsApp: 00905313263722_"
          } >> "$GITHUB_STEP_SUMMARY"
