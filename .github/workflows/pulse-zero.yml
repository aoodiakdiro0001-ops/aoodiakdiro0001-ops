name: 🫀 Pulse-Zero · Reputation Radar

# خادم مجاني مجدول: يمسح التقييمات كل 3 ساعات، يحللها بالـ AI،
# يخزّنها في Supabase، ويرسل الإنذارات العاجلة على تليجرام.

on:
  schedule:
    - cron: "0 */3 * * *"        # دورة الرصد: كل 3 ساعات
    - cron: "0 8 * * 0"          # تقرير السمعة الأسبوعي: الأحد 08:00 UTC
  workflow_dispatch:             # تشغيل يدوي فوري من واجهة GitHub
    inputs:
      mode:
        description: "نوع التشغيل"
        type: choice
        options: [cycle, cycle-dry, report]
        default: cycle
  push:
    paths:
      - "pulse-zero/**"          # اختبار سريع عند تعديل الكود نفسه
      - ".github/workflows/pulse-zero.yml"

permissions:
  contents: read

concurrency:
  group: pulse-zero
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production      # اختيارية — احمِ بها الـ Secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pulse-zero/scripts/requirements.txt

      - name: Install dependencies (free OSS only)
        run: |
          python -m pip install --upgrade pip
          pip install -r pulse-zero/scripts/requirements.txt

      - name: 🔍 Quick self-test (demo pipeline, no secrets needed)
        working-directory: pulse-zero/scripts
        run: python pulse_zero.py --dry-run --no-dedupe --limit 10

      - name: 📊 Weekly reputation report (Sunday cron or manual)
        if: >-
          github.event.inputs.mode == 'report' ||
          (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 0')
        working-directory: pulse-zero/scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pulse_zero.py --report

      - name: 🫀 Main radar cycle
        if: github.event.inputs.mode != 'report'
        working-directory: pulse-zero/scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "cycle-dry" ]; then
            python pulse_zero.py --dry-run
          else
            python pulse_zero.py
          fi

      - name: ☁️ Persist local JSON state when Supabase is not configured
        if: success() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pulse-zero-state
          path: pulse-zero/scripts/state/
          retention-days: 30
